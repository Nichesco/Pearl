name: Pearl Profit Switcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (true = log decisions without starting/stopping)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: pearl-profit-switcher
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run SaladCloud ROI switcher
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
          SALAD_ORG: ${{ vars.SALAD_ORG || 'pearl123s' }}
          SALAD_PROJECT: ${{ vars.SALAD_PROJECT || 'pearl-test-4090' }}
          MAX_DAILY_USD: ${{ vars.MAX_DAILY_USD || '20' }}
          START_ROI_PCT: ${{ vars.START_ROI_PCT || '15' }}
          STOP_ROI_PCT: ${{ vars.STOP_ROI_PCT || '10' }}
          LOW_START_ROI_PCT: ${{ vars.LOW_START_ROI_PCT || '2' }}
          LOW_STOP_ROI_PCT: ${{ vars.LOW_STOP_ROI_PCT || '0' }}
          FEE_PCT: ${{ vars.FEE_PCT || '2.0' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || 'false' }}
        run: python3 switcher.py
